name: Linux build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Linux amd64
        run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-development
          path: dist/linux-amd64/cpa-quota.so
          if-no-files-found: error
